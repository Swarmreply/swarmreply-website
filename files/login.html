  :root{--k:var(--ink);--w:var(--paper);--g:var(--honey);--gd:var(--amber);--of:var(--cream);--bd:var(--line);--mu:var(--taupe);--gr:var(--green);--re:var(--danger)}

body{font-family:'DM Sans',sans-serif;background:var(--of);min-height:100%;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;color:var(--tx)}
body{background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20width%3D'28'%20height%3D'49'%20viewBox%3D'0%200%2028%2049'%3E%3Cpath%20d%3D'M13.99%209.25l13%207.5v15l-13%207.5L1%2031.75v-15l12.99-7.5zM3%2017.9v12.7l10.99%206.34%2011-6.35V17.9l-11-6.34L3%2017.9zM0%2015l12.98-7.5V0h-2v6.35L0%2012.69v2.3zm0%2018.5L12.98%2041v8h-2v-6.85L0%2035.81v-2.3zM15%200v7.5L27.99%2015H28v-2.31h-.01L17%206.35V0h-2zm0%2049v-8l12.99-7.5H28v2.31h-.01L17%2042.15V49h-2z'%20fill%3D'%23a89878'%20fill-opacity%3D'0.03'%2F%3E%3C%2Fsvg%3E");background-repeat:repeat;background-size:84px auto}
.glow{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(58% 52% at 50% 34%,rgba(245,200,66,.14),transparent 70%)}
.page{flex:1;display:flex;align-items:center;justify-content:center;padding:44px 20px;position:relative;z-index:1}
.card{width:100%;max-width:430px;background:var(--w);border:1px solid var(--bd);border-radius:22px;padding:46px 42px 38px;box-shadow:0 26px 70px rgba(20,16,8,.13),0 4px 14px rgba(20,16,8,.05);position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--g),var(--gd))}
.logo{display:flex;align-items:center;justify-content:center;gap:11px;margin-bottom:24px}
.logo img{height:42px;width:auto;display:block}
.logo .wm{font-family:'Playfair Display',serif;font-weight:900;font-size:1.55rem;color:var(--k);line-height:1}
.hed{font-family:'Playfair Display',serif;font-size:2rem;font-weight:900;color:var(--k);text-align:center;letter-spacing:-.02em;line-height:1.1;margin-bottom:9px}
.sub{font-size:.9rem;color:var(--mu);text-align:center;line-height:1.6;margin:0 auto 28px;max-width:30ch}

.frow{margin-bottom:17px}
.fl{display:block;font-size:.67rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin-bottom:6px}
.fi{width:100%;padding:13px 15px;border:1.5px solid var(--bd);border-radius:11px;font-size:16px;font-family:'DM Sans',sans-serif;color:var(--tx);outline:none;transition:border-color .15s,box-shadow .15s;background:#fff;-webkit-appearance:none}

#success-box{display:none;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:11px 14px;font-size:.82rem;color:#15803d;margin-bottom:16px;line-height:1.5}

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#f5c842">
<meta name="apple-mobile-web-app-capable" content="yes">

<body>
<div class="glow"></div>
<div class="page">
  <div class="card">
    <div class="logo"><img src="/bee-logo.png" alt="SwarmReply bee logo"><span class="wm">SwarmReply</span></div>
    <h1 class="hed">Welcome back.</h1>
    <p class="sub">Sign in to manage your reviews, replies, and reports.</p>
        <div id="err-box"></div>
        <div id="success-box"></div>

        <form id="loginForm" onsubmit="handleLogin(event)">
          <div class="frow">
            <label class="fl" for="email">Email address</label>
            <input class="fi" type="email" id="email" name="email" placeholder="you@yourbusiness.com" autocomplete="email" required>
          </div>
          <div class="frow">
            <label class="fl" for="password">Password</label>
            <div class="pw-wrap">
              <input class="fi" type="password" id="password" name="password" placeholder="Your password" autocomplete="current-password" required>
              <button type="button" class="pw-toggle" id="pwToggle" onclick="togglePw()">Show</button>
            </div>
            <div class="forgot-row">
              <a href="https://app.swarmreply.com/forgot-password" class="forgot-link" id="forgotLink">Forgot password?</a>
            </div>
          </div>
          <button type="submit" class="btn btn-gold btn-block" id="loginBtn">Sign in to dashboard &rarr;</button>
        </form>

        <div class="divider"><span>New to SwarmReply?</span></div>
        <a href="/signup.html" class="btn btn-ghost btn-block">Get started — from $99/mo &rarr;</a>
        <a href="/" class="back-link">&larr; Back to swarmreply.com</a>
  </div>
</div>

<script>
// ── CONFIG ─────────────────────────────────────────────────────────────────
var API_URL = 'https://api.swarmreply.com/api';
var APP_URL = 'https://app.swarmreply.com';

// Update forgot password link
document.getElementById('forgotLink').href = APP_URL + '/forgot-password';

// ── PASSWORD TOGGLE ────────────────────────────────────────────────────────
function togglePw() {
  var pw  = document.getElementById('password');
  var btn = document.getElementById('pwToggle');
  var showing = pw.type === 'text';
  pw.type = showing ? 'password' : 'text';
  btn.textContent = showing ? 'Show' : 'Hide';
}

// ── LOGIN ──────────────────────────────────────────────────────────────────
async function handleLogin(e) {
  e.preventDefault();
  var email    = document.getElementById('email').value.trim();
  var password = document.getElementById('password').value;
  var btn      = document.getElementById('loginBtn');
  var errBox   = document.getElementById('err-box');
  var sucBox   = document.getElementById('success-box');

  btn.disabled = true;
  btn.textContent = 'Signing in...';
  errBox.style.display = 'none';
  sucBox.style.display = 'none';

  try {
    var res  = await fetch(API_URL + '/customers/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, password: password })
    });
    var data = await res.json();

    if (res.ok && data.accessToken) {
      localStorage.setItem('swarmreply_token', data.accessToken);
      sucBox.textContent = 'Logging you in...';
      sucBox.style.display = 'block';
      window.location.href = APP_URL + '/dashboard#token=' + encodeURIComponent(data.accessToken);
    } else if (res.status === 401) {
      errBox.textContent = 'Invalid email or password. Please try again.';
      errBox.style.display = 'block';
    } else if (res.status === 429) {
      errBox.textContent = 'Too many failed attempts. Please wait 15 minutes before trying again.';
      errBox.style.display = 'block';
    } else if (res.status === 403) {
      errBox.textContent = data.error || 'Account access denied. Contact hello@swarmreply.com';
      errBox.style.display = 'block';
    } else {
      errBox.textContent = data.error || 'Something went wrong. Please try again.';
      errBox.style.display = 'block';
    }
  } catch (err) {
    errBox.textContent = 'Unable to connect. Check your connection and try again.';
    errBox.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Sign in to dashboard \u2192';
  }
}
</script>

</body>
